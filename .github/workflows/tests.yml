name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_paper_network.py

  icub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pinocchio URDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburdfdom-dev
      - run: pip install -e ".[test,robot]"
      - run: pytest -q tests/test_icub_teacher.py tests/test_paper_on_icub.py
      - name: Strict paper-form smoke run
        run: |
          python -m esbn_icub.paper_on_icub             --neurons 64             --train-iterations 2             --steps-per-iteration 25             --test-input-steps 10             --test-free-steps 10             --input-amplitude 0.05             --no-plot
      - name: Strict paper-form canonical run
        run: |
          python -m esbn_icub.paper_on_icub --no-plot
