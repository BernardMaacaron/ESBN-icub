name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_paper_network.py

  icub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pinocchio URDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburdfdom-dev
      - run: pip install -e ".[test,robot]"
      - run: pytest -q tests/test_icub_teacher.py tests/test_paper_on_icub.py
      - name: End-to-end smoke run
        run: |
          python -m esbn_icub.paper_on_icub \
            --neurons 64 \
            --train-episodes 2 \
            --train-steps 40 \
            --test-steps 40 \
            --no-plot
      - name: Untrained autonomous baseline
        run: |
          echo "EXPERIMENT untrained_baseline"
          python -m esbn_icub.paper_on_icub \
            --train-episodes 0 \
            --no-plot
      - name: Baseline constant-feedback run
        run: |
          echo "EXPERIMENT baseline_constant_feedback"
          python -m esbn_icub.paper_on_icub \
            --feedback-gain 40 \
            --final-feedback-gain 40 \
            --no-plot
      - name: Canonical annealed-feedback run
        run: |
          echo "EXPERIMENT canonical_annealed_feedback"
          python -m esbn_icub.paper_on_icub \
            --feedback-gain 40 \
            --final-feedback-gain 10 \
            --no-plot
      - name: Longer-training annealed run
        run: |
          echo "EXPERIMENT longer_training_annealed"
          python -m esbn_icub.paper_on_icub \
            --train-episodes 200 \
            --train-steps 250 \
            --sync-steps 75 \
            --feedback-gain 40 \
            --final-feedback-gain 10 \
            --eta 0.0075 \
            --no-plot
