name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_alemi_ebn.py tests/test_excitation.py tests/test_nonlinear_teacher.py tests/test_bistable_demo.py tests/test_normalization.py
      - name: Report bistable autonomous metric
        run: |
          python - <<'PY'
          from esbn_icub.bistable_demo import run_bistable_trials
          r = run_bistable_trials(
              train_trials=200,
              train_trial_steps=1000,
              command_steps=500,
              test_steps=6000,
              n_neurons=50,
              seed=0,
          )
          print({k: v for k, v in r.items() if not k.endswith("_trace")})
          PY

  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test,robot]"
      - run: pytest -q tests/test_icub_teacher.py tests/test_robot_experiment.py tests/test_arm_learning.py
